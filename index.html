<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>Family List</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            -webkit-tap-highlight-color: transparent;
            min-height: 100dvh;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .item-checked {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>
<body class="text-[#191c1e] flex flex-col">

    <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-gray-200 shadow-sm flex justify-between items-center px-4 h-16">
        <h1 class="text-xl局 font-bold text-[#3525cd]">Family Lists</h1>
        <button onclick="refreshList()" class="p-2 active:scale-90 transition-transform text-[#464555]">
            <span class="material-symbols-outlined">refresh</span>
        </button>
    </header>

    <main class="flex-grow pt-24 pb-32 px-4 max-w-md mx-auto w-full">
        <div id="loader" class="text-center py-12 text-sm text-gray-500 font-medium">
            Loading family list...
        </div>

        <div id="list-container" class="space-y-3 hidden"></div>
    </main>

    <div class="fixed bottom-0 w-full z-50 bg-white/80 backdrop-blur-xl border-t border-gray-200 pb-safe shadow-lg">
        <div class="px-4 py-3">
            <div class="relative flex items-center">
                <span class="material-symbols-outlined absolute left-4 text-[#3525cd]">add</span>
                <input id="item-input" type="text" placeholder="Add an item & press Enter..." 
                       class="w-full pl-12 pr-4 py-3.5 bg-gray-100 focus:bg-gray-200 rounded-xl border-none focus:ring-0 text-base transition-colors" />
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
